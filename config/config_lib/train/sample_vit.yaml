net:
  output: [head, head_supcon_bin, head_supcon_id, head_supcon_mask, head_supcon_glasses]
  input: [[224,224,3]]
  ckpt: # this is for finetuning / loading the checkpoints
    # dir: temp_ckpt/260504_b16_xgaze_all
    # name: ckpt_epoch_00000.pyth

  face_feature:
    module_input: # OrderedDict
      input: all
    module_output: [[768], [8,224,224]]
    type: mae
    args:
      # sbranch_normalize: True
      # num_classes: 512
      # pretrained: 
      pretrained: /data/lzh/UniGaze/ckpts/mae_b16_checkpoint-299.pth
      decoder_type: v0
      # decoder_type: v2 # for seg branch

  head:
    module_input:
      face_feature: 0
    module_output: [[60]]
    type: mlp
    args:
      input: 768
      channels: [256, 60]
      normalize: True

  head_supcon_bin:
    module_input:
      face_feature: 0
    module_output: [[128]]
    type: mlp
    args:
      input: 768
      channels: [128]
      normalize: True

  head_supcon_id:
    module_input:
      face_feature: 0
    module_output: [[128]]
    type: mlp
    args:
      input: 768
      channels: [128]
      normalize: True

  head_supcon_mask:
    module_input:
      face_feature: 0
    module_output: [[128]]
    type: mlp
    args:
      input: 160
      channels: [128]

  head_supcon_glasses:
    module_input:
      face_feature: 0
    module_output: [[128]]
    type: mlp
    args:
      input: 160
      channels: [128]
  
  # head_seg:
  #   module_input:
  #     face_feature: 1
  #   module_output: [[8,224,224]]
  #   type: identity
  #   args:
  #     placeholder:
   
train:
  num_gpus: 8
  gpus: [0,1,2,3,4,5,6,7]
  gpu_base: 0
  batch_per_gpu: 240
  ckpt_dir: <output_ckpt_path>
  ckpt_period: 1
  ckpt_auto_clear: True
  num_epochs: 50
  simsiam: 0
  log_period: 10
  val_period: 10
  val_print_car: True
  infer_test: False
  iters_limit: 100000
  lr: 1e-5
  seed: 0
  num_views: 1
  flip_every_other_view: True
  glasses_latter_half_views: False
  share_t2d: True
  bin_temperature: 0.2

  optimizer:
    face_feature:
      type: adam
      lr: 1e-5
      args:
    default:
      type: adam
      lr: 1e-5
      args:
  
  loss:
    loss1: #l(x, gt) L([Tensor])
      module_input:
        head: all # from Net
        dataset: [1,2,3] # from Dataset
      type: car
      args:
        nbins_pitch: 26
        nbins_yaw: 34
        bin_size: 4.0
        beta_y: 5.0
        beta_p: 5.0
        pitch_bias: -5.0
        angular_error: False
        temperature: 0.2
  
    # loss2:
    #   module_input:
    #     head_seg: all
    #     dataset: [4,5,6,7,8] # from Dataset Bx4x224x224  Bx8x224x224
    #   type: dice
    
    loss3:
      module_input:
        head: all
        dataset: [1,2] # from Dataset
      type: car
      args:
        nbins_pitch: 26
        nbins_yaw: 34
        bin_size: 4.0
        beta_y: 5.0
        beta_p: 5.0
        pitch_bias: -5.0
        angular_error: True
        temperature: 0.2

    loss4:
      module_input:
        head_supcon_bin: all
        dataset: 2
      type: binsupcon
      args:
        adversarial: False

    loss5:
      module_input:
        head_supcon_id: all
        dataset: 3 # dataset_id
      type: supcon
      args:
        adversarial: True

    loss6:
      module_input:
        head_supcon_mask: all
        dataset: 10 # aug_mask
      type: supcon
      args:
        adversarial: True
        n_views: 4

    loss7:
      module_input:
        head_supcon_glasses: all
        dataset: 11 # aug_glasses
      type: supcon
      args:
        adversarial: True
        n_views: 4
    
    
    loss_train:
      loss1: 0.2 # 1207: 0.1 to 0.15
      # loss2: 0.5
      loss4: 0.025 # 1225: big supcon losses cause nan
      loss5: 0.025
      loss6: 0.025
      loss7: 0.025

    loss_val:
      loss3: 1

data:
  dataset_train:
    type: Hybrid_v2
    args:
      path_prefix: 'face_224'
      labels: ['subject_cid', 'gaze', 'bin', 'dataset_id', 'facemap_v3', 'wE_L', 'wI_L', 'wE_R', 'wI_R', 'id', 'aug_mask', 'aug_glasses']
      mixup: False
      mixup_halfandhalf: False
      mixup_thresh: 0.5
      cam_id: None
      target_N: 106080
      bin_sampler: False
      n_views: 4
      flip_mode: 'on' # Samuel's feature
      facemap: True
      augment: True
      debug: False
      face_replace_green: True
      augment_glasses: True
      face_apply_mask: True
      split: 'train'
      skip_val: True
      bin_args:
        pitch_nbins: 26
        yaw_nbins: 34
        bin_size: 4.0
        pitch_bias: -5.0    
      output_gazemap: True
